# Sentiment source and symbol registry.
#
# Adding a tradable symbol or a news feed here is a config change — no code
# edits across the tagging, scoring, and aggregation layers.
#
#   symbols.<SYMBOL>.keywords : words that tag an article with this symbol
#   symbols.<SYMBOL>.lexicon  : which scoring lexicon to use (see SimpleLexiconScorer)
#   sources.<name>.client     : "rss" (GenericRssClient) or a built-in client key
#   sources.<name>.url        : feed URL (rss clients)
#   sources.<name>.symbols    : symbols this source is allowed to tag (scope)
#   sources.<name>.weight     : relative trust when aggregating (default 1.0)

symbols:
  # Market-wide crypto terms (CRYPTO/DEFI/STABLECOIN/TOKENIZED) are on BOTH
  # symbols deliberately. Two thirds of ingested articles were tagging to no
  # symbol at all, and the crypto misses were overwhelmingly stories that never
  # write "BTC" or "ETHEREUM" in the headline: "Crypto climbs off worst levels",
  # "PayPal expands stablecoin push", "1inch moves to unite DeFi liquidity".
  # ETH was worst hit — 5 events in 24h — because almost nothing says "Ethereum"
  # in a title.
  #
  # The tradeoff, stated so it is a choice rather than an accident: a market-wide
  # term tags both symbols, so their z-scores become more correlated. That is
  # honest (BTC and ETH do move together on regulatory and flow news) but it
  # means the two are less independent as signals.
  #
  # Leakage into OIL is impossible regardless: crypto sources are scoped to
  # [BTC-USD, ETH-USD] and oil sources to [OIL-USD], so scope bounds recall.
  #
  # Follows the OIL precedent from #431 — add terms that are high-precision for
  # the asset, omit low-precision ones. BLOCKCHAIN is excluded on purpose:
  # enterprise-blockchain stories are not market-moving for spot BTC/ETH.
  BTC-USD:
    keywords: [BTC, BITCOIN, SATOSHI, HALVING, MARA, RIOT, MICROSTRATEGY,
      CRYPTO, DEFI, STABLECOIN, TOKENIZED]
    lexicon: crypto
  ETH-USD:
    keywords: [ETH, ETHEREUM, ETHER, VITALIK, "ERC-20",
      CRYPTO, DEFI, STABLECOIN, TOKENIZED]
    lexicon: crypto
  OIL-USD:
    # Commodity terms + high-signal geopolitical/supply-disruption terms (issue
    # #431) so oil catalysts that never say "oil/crude" (Hormuz, Houthi, Red Sea,
    # sanctions, Iran) still route to OIL-USD. Deliberately omits low-precision
    # terms (bare "war"/"strike"/"Israel") that false-positive off oil. Sources
    # are oil-scoped, so recall gains here don't leak into other symbols.
    keywords: [OIL, CRUDE, WTI, BRENT, OPEC, PETROLEUM, BARREL,
      HORMUZ, HOUTHI, "RED SEA", TANKER, REFINERY, PIPELINE, RIG,
      SANCTIONS, SANCTION, EMBARGO, IRAN, SAUDI, "SUPPLY DISRUPTION"]
    lexicon: oil

sources:
  # Donald Trump's TRUTH Social posts (issue #433). Frequently market-moving on
  # oil (OPEC/Houthis/Saudi/sanctions), Iran/geopolitics, and crypto. Standard
  # RSS 2.0 with full post text; scoped to all tradable symbols so the keyword
  # router attributes each post — off-topic political posts match nothing and are
  # dropped. Single-author = high variance, so weight is moderate; sentiment is a
  # gate (not a trigger), which bounds the downside.
  trumpstruth_rss:
    client: rss
    url: https://trumpstruth.org/feed
    symbols: [OIL-USD, BTC-USD, ETH-USD]
    weight: 1.0
  cryptopanic:
    client: cryptopanic
    symbols: [BTC-USD, ETH-USD]
    weight: 1.0
  coindesk_rss:
    client: coindesk
    symbols: [BTC-USD, ETH-USD]
    weight: 1.0
  cointelegraph_rss:
    client: cointelegraph
    symbols: [BTC-USD, ETH-USD]
    weight: 1.0
  oilprice_rss:
    client: rss
    url: https://oilprice.com/rss/main
    symbols: [OIL-USD]
    weight: 1.0
  # Additional energy-news source (issue #431) to raise oil inflow beyond the
  # existing feeds. Validated 200/valid-RSS 2026-07-23.
  rigzone_rss:
    client: rss
    url: https://www.rigzone.com/news/rss/rigzone_latest.aspx
    symbols: [OIL-USD]
    weight: 0.8
  investing_commodities_rss:
    client: rss
    url: https://www.investing.com/rss/news_11.rss
    symbols: [OIL-USD]
    weight: 0.7
  eia_today_in_energy_rss:
    client: rss
    url: https://www.eia.gov/rss/todayinenergy.xml
    symbols: [OIL-USD]
    weight: 1.0
  # Numeric fundamental (weekly crude build/draw), built explicitly by
  # EiaInventoryClient — not an rss feed. Needs ENV["EIA_API_KEY"].
  eia_inventory:
    client: eia
    symbols: [OIL-USD]
    weight: 1.5
