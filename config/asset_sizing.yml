# Per-asset sizing (issue #340). Data-driven so adding a tradable asset is a
# config edit, not a code change. Before this, RapidSignalEvaluationJob `case`d
# only BTC/ETH and every other asset (OIL, metals, any expansion pair) fell to
# crypto-shaped defaults -> mis-sized caps and risk.
#
#   contract_size_usd : FALLBACK $ notional/contract, used only when the exchange
#                       contract-size lookup (ContractSizeResolver) fails.
#   max_contracts     : max contracts per signal for the asset.
#   max_concurrent    : max concurrent open positions for the asset.
#
# `default` applies to any asset without an entry — deliberately conservative
# (never the crypto shape).
default:
  contract_size_usd: 100.0
  max_contracts: 2
  max_concurrent: 1

assets:
  BTC:
    contract_size_usd: 100.0
    max_contracts: 5
    max_concurrent: 2
  ETH:
    contract_size_usd: 10.0
    max_contracts: 10
    max_concurrent: 3
  OIL:
    # NOL notional ~$930/contract (~9x a BTC nano), so cap contracts low to keep
    # risk comparable. Conservative — review as oil trading ramps.
    contract_size_usd: 930.0
    max_contracts: 1
    max_concurrent: 1

# Per-CONTRACT overrides, keyed by Coinbase product-ID prefix (issue #486
# precondition 4). Layered over the `assets` entry for the contract's base
# currency, which is layered over `default` — so an entry here need only state
# what differs.
#
# Exists because base currency is too coarse a key for this venue: BIT (dated
# nano, ~$100/contract) and BIP (perp, ~$659/contract) are both "BTC", so the
# perp silently inherited the nano's 5-contract / 2-concurrent shape.
contracts:
  BIP:
    # BTC perp, ADR 0002's home instrument. Pinned to ONE contract and ONE
    # concurrent position for the #486 calibration run and #392 condition 1
    # (min_position_size = 1 for perps). Do not raise either without re-opening
    # #392 — the whole $150 loss budget assumes a single contract of exposure.
    contract_size_usd: 659.0
    max_contracts: 1
    max_concurrent: 1
  PAU:
    # PAXG (gold) perp: $4,082 notional/contract measured 2026-07-27 (ADR 0004).
    # Base currency PAXG has no `assets` entry, so this used to fall to
    # `default` — a $100 fallback notional, understating a PAU contract 40x, at
    # 2 contracts. Ingest-only today (ADR 0006 fails closed), but the fallback
    # should not be wrong if it is ever reached.
    contract_size_usd: 4082.0
    max_contracts: 1
    max_concurrent: 1
  XPP:
    # XRP perp, ADR 0002's designated second seat. Measured from the products
    # API 2026-07-28: contract_size 500 x $1.0635 = $531.75/contract.
    #
    # Base currency XRP has no `assets` entry, so this fell to `default` — a
    # $100 fallback, understating an XPP contract 5.3x. That is the DANGEROUS
    # direction: an understated contract_size_usd makes the sizer believe a
    # position is smaller than it is, so the notional cap binds later than it
    # should. Left unmeasured it was a latent oversizing, not a safe unknown.
    #
    # Pinned 1/1 like the other perps: XPP has never traded and has no walk-
    # forward verdict, so it does not get a larger allowance than BIP, which is
    # the instrument ADR 0002 actually designated as home.
    contract_size_usd: 531.75
    max_contracts: 1
    max_concurrent: 1
